name: Telegram Auto Poster

on:
  schedule:
    - cron: '0 6,12,16 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI beautifulsoup4 requests feedparser
          
      - name: Run script
        run: python main.py

      - name: Save memory (Commit posted urls)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted_urls.txt || true
          git commit -m "Update post history" || true
          git push
