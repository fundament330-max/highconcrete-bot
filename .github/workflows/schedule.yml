name: Telegram Auto Poster
on:
  schedule:
    - cron: '0 7,13 * * *' # Запуск каждый день в 10:00 и 16:00 по МСК (7 и 13 по UTC)
  workflow_dispatch: # Позволяет запускать скрипт вручную одной кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run script
        run: python main.py
