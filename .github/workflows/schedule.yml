name: Telegram Auto Poster

on:
  schedule:
    # Запуск 3 раза в день: в 9:00, 15:00 и 19:00 по Москве
    # В GitHub время указывается по UTC (минус 3 часа от МСК)
    - cron: '0 6,12,16 * * *' 
  workflow_dispatch: # Оставляем ручную кнопку на всякий случай

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI beautifulsoup4 requests feedparser
          
      - name: Run script
        run: python main.py
